; INSTALL.INI for the GeosOne DOS Installer (INSTALL.EXE, from
; https://github.com/geosone/gdi, GPL version 3)
[Setup]
Title=SHSUCD Setup
Product=GeosOne SHSUCD
Version=4.00-g1
Id=SHSUCD
License=SHSUCD.LIC
Readme=README.TXT
; in C:\OPENASPI with AHCIASPI, EUSBASPI and OpenASPI (they bring SHSUCDX
; too); this installer and its journals in C:\OPENASPI\SHSUCD
DefaultDir=%BOOT%\OPENASPI
SetupDir=SHSUCD
Done=SHSUCDX is installed. Restart the computer.

[Welcome]
SHSUCDX is a CD-ROM redirector like MSCDEX (MS-DOS) and NWCDEX (DR-DOS):
it gives CD-ROM drives their drive letters. This version plays the audio
tracks of games digitally through VSBHDA (Sound Blaster emulation) when
the drive has no analog audio cable.

Setup puts SHSUCDX in the place of MSCDEX or NWCDEX in AUTOEXEC.BAT; the
CD-ROM drivers (/D:) and drive letters stay. SHSUCDHD.EXE uses CD images
(.ISO, or .CUE/.BIN with audio tracks through MKCDM) as drives.

[Options]
Option=on|AUTOEXEC.BAT: SHSUCDX instead of MSCDEX, NWCDEX or another SHSUCDX
Option=on|CD audio through VSBHDA when it is loaded (/A:AUTO), else the drive plays
Option=on|Add the installation directory to the PATH (CDAUDIO, SHSUCDHD, MKCDM)

[Files]
SHSUCDX.COM
CDAUDIO.COM
SHSUCDHD.EXE
MKCDM.EXE
README.TXT=CDSETUP.TXT
SHSUCD.TXT
SHSUCDX.TXT
SHSUCD.LIC

[Autoexec.bat]
Program=1|MSCDEX,NWCDEX,SHSUCDX|%DIR%\SHSUCDX.COM
Extend=1,2|SHSUCDX| /A:AUTO
PathAppend=3|%DIR%
